name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'   # saptamanal (luni 04:17 UTC): prinde driftul de schema ANAF
  workflow_dispatch:        # rulare manuala la cerere

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # node:sqlite (src/store.js) cere Node 22.5+; productia ruleaza 22
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # SUITA COMPLETA — identica cu `npm test` local: sintaxa + garda DB + breachCheck
      # (fetch stub, fara apeluri externe) + module + ANAF (stub) + store + HTTP pe sqlite.
      # Paritate CI <-> local: ce trece local trece si aici, si invers.
      - name: Suita completa (npm test)
        run: npm test
      # Exercita calea de citire SQL a balantei (pas 5): prag 0 -> orice firma foloseste SQL, cu
      # ACELEASI aserttii de balanta (dovada de echivalenta SQL == RAM pe sqlite).
      - name: Balanta pe calea SQL (prag 0, sqlite)
        env:
          CONTAB_SQL_READ_THRESHOLD: '0'
        run: node test/http.js

  # Audit de securitate al dependentelor: pica pe vulnerabilitati HIGH/CRITICAL (moderate/low
  # sunt doar raportate, nu blocheaza). Ruleaza pe fiecare push/PR ca un pachet vulnerabil sa fie
  # prins imediat, nu la urmatorul deploy. NU se pune in `npm test`/prestart local (cere reteaua
  # si nu trebuie sa blocheze pornirea serverului de productie).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: npm audit (high/critical)
        run: npm audit --audit-level=high

  # Suita HTTP pe driverul PostgreSQL (paritate cu productia).
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: contab
          POSTGRES_PASSWORD: contab
          POSTGRES_DB: contab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Store incremental pe PostgreSQL (paritate cu SQLite)
        env:
          CONTAB_PG_URL: postgres://contab:contab@localhost:5432/contab_test
        run: node test/store-pg.js
      - name: Suita HTTP pe PostgreSQL
        env:
          CONTAB_TEST_DRIVER: pg
          CONTAB_PG_URL: postgres://contab:contab@localhost:5432/contab_test
        run: node test/http.js
      - name: Balanta pe calea SQL (prag 0, PostgreSQL)
        env:
          CONTAB_TEST_DRIVER: pg
          CONTAB_PG_URL: postgres://contab:contab@localhost:5432/contab_test
          CONTAB_SQL_READ_THRESHOLD: '0'
        run: node test/http.js

  # ── POARTA FISCALA: conditie de RELEASE, pe FIECARE push/PR care atinge module fiscale ──
  # Diviziunea muncii cu `validare-anaf` de mai jos:
  #   poarta-fiscala : prinde REGRESIA PROPRIE, inainte de merge — ruleaza doar cand s-a atins
  #                    ceva fiscal (perimetrul e in scripts/poarta-fiscala.sh, sursa unica).
  #   validare-anaf  : prinde DRIFTUL DE SCHEMA ANAF — ruleaza periodic, si cand nimic nu s-a
  #                    schimbat la noi (acolo se misca validatorul, nu codul).
  # Poarta NU are portita: „n-am putut verifica" (ANAF picat, XSD nesetat) blocheaza la fel ca
  # „invalid" — un gate care trece cand n-a verificat nimic e mai rau decat lipsa lui.
  # Ca sa devina obligatorie la merge: Branch protection -> Required status checks -> poarta-fiscala.
  poarta-fiscala:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # merge-base cu main: poarta compara fata de punctul comun
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: xmllint (validarea XSD e-Transport)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
      - name: Cache DUKIntegrator
        uses: actions/cache@v6
        with:
          path: /var/tmp/contab-duk
          key: dukintegrator-dist-v1
      - run: git fetch --no-tags origin main
      # Schema e-Transport e VERSIONATA in repo (schemas/eTransport/*.xsd) — runnerul e o masina
      # efemera, deci o variabila cu o CALE n-ar indica nimic aici. Vezi schemas/eTransport/README.md.
      - name: Poarta fiscala (validatoare oficiale ANAF)
        run: sh scripts/poarta-fiscala.sh origin/main

  # Validarea OFICIALA ANAF (DUKIntegrator) pe fisierele de referinta generate din seed.
  # Rol distinct fata de poarta: prinde driftul de schema ANAF, adica exact cazul in care codul
  # nostru NU s-a schimbat (deci poarta nu se aplica), dar validatorul da.
  validare-anaf:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: xmllint (validarea XSD e-Transport)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
      # cache pentru distributia DUKIntegrator (~36MB) — validatoarele se reimprospateaza singure
      - name: Cache DUKIntegrator
        uses: actions/cache@v6
        with:
          path: /var/tmp/contab-duk
          key: dukintegrator-dist-v1
      - name: Genereaza + valideaza referintele cu validatoarele oficiale ANAF
        run: sh scripts/valideaza-referinte.sh
