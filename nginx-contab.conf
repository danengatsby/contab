# Contab — reverse proxy nginx catre aplicatia Node (pm2, 127.0.0.1:8080).
#
# ACEASTA E COPIA DIN DEPOZIT a fisierului viu /etc/nginx/sites-available/contab.
# Fisierul viu e modificat SI de certbot (liniile „managed by Certbot"), deci cele doua pot
# DRIFTA — si chiar au driftat: doua blocuri `location` (exceptia ACME si blocarea cailor cu
# punct) au trait doar pe server intre 2026-07-28 si 2026-08-12, adica infrastructura de
# productie nu era versionata. Unul dintre ele e plasa de reinnoire a certificatului: o
# schimbare gresita acolo nu se vede azi, se vede peste doua luni, cand expira TLS-ul.
#
# DRIFTUL SE VERIFICA, nu se tine minte:  npm run nginx-drift
#   0 = identice pe directive | 1 = DRIFT | 2 = NEVERIFICAT (fara acces la fisierul viu)
# „N-am putut verifica" nu e „e bine" — acelasi contract ca la poarta fiscala si `npm run test-pg`.
#
# La orice schimbare: modifica fisierul viu, `sudo nginx -t`, `sudo systemctl reload nginx`,
# apoi copiaza inapoi aici si comite (`npm run nginx-drift` trebuie sa iasa 0).
#
# Activare pe o masina noua:
#   sudo cp nginx-contab.conf /etc/nginx/sites-available/contab
#   sudo ln -s /etc/nginx/sites-available/contab /etc/nginx/sites-enabled/contab
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS (dupa ce DNS-ul propaga):
#   sudo certbot --nginx -d contabo.space -d www.contabo.space
#
# NU e aici, si nu e drift: `gzip on` si restul compresiei stau in blocul `http` GLOBAL
# (/etc/nginx/nginx.conf), nu in configul sitului.


# Plafon de debit pe caile de AUTENTIFICARE, ca prima plasa — inaintea Node.
# Aplicatia are deja plafoane proprii (8 incercari esuate/IP la login, 5 inscrieri/ora/IP,
# 600 cereri/min general) si ELE raman autoritatea pe reguli. Rolul nginx e altul: sa nu coste
# o tura de event loop fiecare cerere dintr-un val. Deci limita de aici e calibrata PESTE
# folosirea umana normala si sub abuz — un contabil face 1-3 incercari de login pe minut.
# 10r/m cu burst=20 lasa loc si unei greseli repetate de parola, dar taie un val automat.
limit_req_zone $binary_remote_addr zone=contab_auth:10m rate=10r/m;
server {
    server_name contabo.space www.contabo.space;

    # upload-uri (PDF-uri primare, extrase bancare) — peste limita implicita nginx de 1m
    client_max_body_size 25m;

    # Caile de autentificare: plafon de debit inaintea aplicatiei.
    # `nodelay` lasa rafala sa treaca imediat (utilizatorul real nu asteapta), dar peste burst
    # se raspunde 503 fara sa se atinga Node.
    location ~ ^/api/(login|demo-login|register|forgot-password|reset/accept)$ {
        limit_req zone=contab_auth burst=20 nodelay;
        limit_req_status 503;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sondele automate dupa secrete scurse (`/.env`, `/.git/config`, `/.aws/credentials`, plus
    # zeci de variante). Masurat in logurile pastrate: ~2.200 de cereri de la ~107 adrese, toate
    # 404. NU exista expunere si regula asta nu o creeaza — `.env` sta la radacina depozitului cu
    # drepturi 600, iar radacina statica servita e `public/`, deci nici nu se poate ajunge la el.
    # Rolul e strict ZGOMOTUL: `444` inchide conexiunea fara niciun raspuns, deci scanerul nu mai
    # primeste nici macar o pagina de eroare din care sa deduca ce ruleaza aici, iar cererea nu
    # mai ajunge la Node si nu mai umple jurnalul.
    #
    # `/.well-known/` e EXCEPTAT: pe acolo trece provocarea ACME prin care certbot reinnoieste
    # certificatul, iar o regula pe puncte fara exceptie nu se vede stricata azi — se vede peste
    # ~2 luni, cand TLS-ul expira. `^~` are prioritate fata de regex, deci castiga oricum ar fi
    # asezate in fisier.
    #
    # MASURAT (2026-08-11), ca sa nu ramana aici o afirmatie mai tare decat proba: `certbot renew
    # --dry-run` reuseste SI fara exceptia asta. Motivul e ca autentificatorul `nginx` isi insereaza
    # pe durata provocarii un `location =` (potrivire EXACTA), care bate regexul de mai jos. Deci
    # exceptia e a doua plasa, nu singura. Ramane pusa fiindca devine singura in clipa in care
    # metoda se schimba in `webroot` sau `standalone`, unde provocarea e un fisier obisnuit sub
    # `/.well-known/acme-challenge/` — si atunci regexul chiar ar taia-o.
    location ^~ /.well-known/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\. {
        access_log off;
        return 444;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # generarea PDF-urilor si apelurile catre ANAF/AI pot dura
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # HTTP/2: multiplexare pe o singura conexiune. Aplicatia incarca ~27 de resurse la prima
    # vizita (modulele ES din public/); pe HTTP/1.1 ele se serializeaza in valuri de cate ~6.
    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    http2 on;
    ssl_certificate /etc/letsencrypt/live/contabo.space/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/contabo.space/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.contabo.space) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = contabo.space) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name contabo.space www.contabo.space;
    return 404; # managed by Certbot




}