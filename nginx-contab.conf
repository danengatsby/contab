# Contab — reverse proxy nginx (subdomeniu dedicat, nu afecteaza pcpens).
# Schimba server_name daca vrei alt subdomeniu.
#
# Activare:
#   sudo ln -s /var/www/contab/nginx-contab.conf /etc/nginx/sites-enabled/contab
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS (optional, dupa ce DNS-ul propaga):
#   sudo certbot --nginx -d contabo.space -d www.contabo.space

server {
    server_name contabo.space www.contabo.space;

    # upload-uri (PDF-uri primare, extrase bancare) — peste limita implicita nginx de 1m
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # generarea PDF-urilor si apelurile catre ANAF/AI pot dura
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/contabo.space/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/contabo.space/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.contabo.space) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = contabo.space) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name contabo.space www.contabo.space;
    return 404; # managed by Certbot




}